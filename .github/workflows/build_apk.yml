name: Build Anime APK

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. جلب الكود الخاص بك من المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد وتثبيت جافا (مطلوب للأندرويد)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. إعداد وتثبيت بايثون
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 4. تثبيت برنامج Flutter يدوياً على السيرفر لمنع السؤال الخطأ
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      # 5. تثبيت مكتبة Flet ومكتبة جلب البيانات
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install flet requests

      # 6. تشغيل البناء مع إرسال مسار Flutter المباشر للسيرفر
      - name: Build Android APK
        run: |
          flet build apk --flutter-path "$FLUTTER_HOME"
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          
      # 7. رفع ملف الـ APK النهائي للتحميل
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: anime-Palestine-App
          path: build/outputs/apk/debug/*.apk
