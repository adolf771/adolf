name: Build Anime APK

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. جلب الكود من المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة جافا (مطلوبة لبناء الأندرويد)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. إعداد بيئة بايثون
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 4. تثبيت وتجهيز الـ Flutter SDK بالكامل على السيرفر
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      # 5. تثبيت المكتبات وأداة Flet الحديثة
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install flet requests

      # 6. تشغيل البناء المباشر بعد ربط مسار الـ Flutter تلقائياً بالبيئة
      - name: Build Android APK
        run: |
          export PATH="$FLUTTER_HOME/bin:$PATH"
          flet build apk
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          
      # 7. رفع ملف الـ APK لتنزيله على هاتفك مباشرة
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: anime-Palestine-App
          path: build/outputs/apk/debug/*.apk
