name: Build Anime APK

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. جلب الكود من المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة جافا (مطلوبة لبناء الأندرويد)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. إعداد بيئة بايثون
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 4. تثبيت المكتبات وأداة Flet
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install flet requests

      # 5. تشغيل البناء المباشر والآمن لـ Flet
      - name: Build Android APK
        run: |
          flet build apk
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          
      # 6. رفع ملف الـ APK لتنزيله على هاتفك مباشرة
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: anime-Palestine-App
          path: build/outputs/apk/debug/*.apk
