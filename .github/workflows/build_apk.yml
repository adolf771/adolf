name: Build Anime APK

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # خطوة أساسية لإعداد وتثبيت الـ Flutter SDK المطلوب لمنع خطأ التوقف
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x' # إصدار متوافق ومستقر مع متطلبات Flet
          channel: 'stable'

      - name: Install Flet and Dependencies
        run: |
          pip install flet requests

      # تشغيل البناء مع إضافة خيار --no-interactive لمنع أي أسئلة تطلب مدخلات يدوية
      - name: Build Android APK
        run: |
          flet build apk --no-interactive
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anime-Rift-App
          path: build/outputs/apk/debug/*.apk
