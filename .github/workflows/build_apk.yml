name: Build APK with Flet

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java (required for Android build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # الخطوة الحاسمة: تثبيت نفس إصدار Flutter الذي تطلبه flet-cli بدقة (3.44.8)
      # هذا يمنع Flet من محاولة تثبيت نسخة أخرى تفاعليًا لاحقًا
      - name: Set up Flutter (pinned to match flet-cli requirement)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Verify Flutter version matches what Flet expects
        run: flutter --version

      - name: Install Python dependencies (from pyproject.toml)
        run: |
          python -m pip install --upgrade pip
          # يثبّت جميع الاعتماديات المعرّفة في pyproject.toml للمشروع نفسه
          pip install .
          # تأكيد إضافي: يضمن وجود أداة flet-cli حتى لو ما كانت مذكورة صراحة كاعتمادية
          pip install flet

      - name: Accept Android SDK licenses (non-interactive)
        run: yes | flutter doctor --android-licenses || true

      - name: Build APK with Flet
        run: |
          flet build apk -v
        env:
          # يمنع أي محاولة تفاعلية أخرى قد تصدر من أدوات فرعية تعتمد على stdin
          CI: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/apk/*.apk
