name: Build Palestine Movie Fast Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Fast Application Dependencies
      run: |
        pip install --upgrade pip
        pip install flet requests pillow urllib3 certifi idna charset-normalizer

    - name: Download Custom App Icon
      run: |
        # تحميل الأيقونة الزرقاء الفخمة التي اخترتها مباشرة وتسميتها باسم المطور الرسمي
        curl -L "https://i.top4top.io/s_3892uwoxs1.png" -o app_icon.png

    - name: Run App Engine to Verify Code
      run: |
        python3 generator_final.py

    - name: Build Fast Android APK with Custom Icon
      run: |
        # الحــــــــل: دمج الأيقونة الجديدة رسمياً وحشو حزم السيرفرات الفرعية (urllib3) دفعة واحدة
        echo "y" | flet build apk --project PalestineMovieApp --module-name generator_final --icon app_icon.png --include-packages requests,pillow,urllib3,certifi,idna,charset-normalizer

    - name: Upload Real Android APK
      uses: actions/upload-artifact@v4
      with:
        name: Palestine-Movie-Fast-App
        path: build/apk/*.apk
