name: Build Palestine Movie Fast Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Flutter Environment
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'

    - name: Install Fast Application Dependencies
      run: |
        pip install --upgrade pip
        pip install flet requests pillow

    - name: Run App Engine to Verify Code
      run: |
        python3 main.py

    - name: Build Fast Android APK
      env:
        # تفعيل نمط البناء الصامت للمطورين في جيت هوب لمنع طرح أي أسئلة يدوية
        CI: "true"
        FLET_CI: "true"
      run: |
        # الأمر القياسي النظيف والنقي بدون أي حِجج زائدة تعترض عليها الأداة
        flet build apk
