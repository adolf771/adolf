name: Build Palestine Movie Fast Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Fast Application Dependencies
      run: |
        pip install --upgrade pip
        pip install flet requests pillow urllib3 certifi idna charset-normalizer

    - name: Download Custom App Icon
      run: |
        # تحميل الأيقونة الزرقاء الفخمة وتسميتها icon.png ليقرأها المحرك تلقائياً
        curl -L "https://top4top.io" -o icon.png

    - name: Run App Engine to Verify Code
      run: |
        python3 generator_final.py

    - name: Build Fast Android APK
      run: |
        # الحــــــــل: الإشارة للمجلد الحالي بالكامل عبر (.) وتحديد اسم ملف التشغيل بدقة
        echo "y" | flet build apk . --main-script-name generator_final.py
        
    - name: Upload Real Android APK
      uses: actions/upload-artifact@v4
      with:
        name: Palestine-Movie-Fast-App
        path: build/apk/*.apk
