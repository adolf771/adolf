name: Build Palestine Movie App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run Scraper to Update Links
      run: node scraper.js

    - name: Setup Gradle 8.6
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.6'

    - name: Install Image Processor
      run: pip install pillow requests

    - name: Generate Code and Icons
      run: python3 generator_final.py

    - name: Auto-increment Version Code
      run: |
        BUILD_NUM=${{ github.run_number }}
        echo "Updating version code to $BUILD_NUM"
        # هذه الخطوة تحدث رقم الإصدار تلقائياً بناءً على رقم الـ Run في جيت هاب
        sed -i "s/versionCode = [0-9]*/versionCode = $BUILD_NUM/g" app/build.gradle.kts || true
        sed -i "s/versionCode [0-9]*/versionCode $BUILD_NUM/g" app/build.gradle.kts || true

    - name: Build Palestine Movie APK
      run: gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Palestine-Movie-App
        path: app/build/outputs/apk/debug/*.apk
