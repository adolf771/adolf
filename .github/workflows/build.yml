name: Build Palestine Movie Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Buildozer and Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev libffi-dev python3-dev aidl
        pip install --upgrade pip
        pip install buildozer cython requests pillow

    - name: Pre-Accept Android SDK Licenses
      run: |
        # تهيئة مجلدات الإعدادات وتأكيد الموافقة على رخص جوجل لمنع مشكلة AIDL
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        echo "241a50a5b92525381211394233f1b6690555d9d3" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
        echo "65111221746b5c1c60f5a5c2d3356020e8a721d0" > ~/.buildozer/android/platform/android-sdk/licenses/android-googletv-license

    - name: Generate Buildozer Specification
      run: |
        if [ ! -f "buildozer.spec" ]; then
          buildozer init
          # تعديل ملف المواصفات ليتوافق مع الرخص والتحميل وصلاحيات الـ APK
          sed -i 's/^title =.*/title = Palestine Movie App/' buildozer.spec
          sed -i 's/^package.name =.*/package.name = palestinemovie/' buildozer.spec
          sed -i 's/^requirements =.*/requirements = python3,kivy,requests,pillow/' buildozer.spec
          sed -i 's/^# android.accept_sdk_license =.*/android.accept_sdk_license = True/' buildozer.spec
          sed -i 's/^#android.permissions =.*/android.permissions = INTERNET,WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE/' buildozer.spec
        fi

    - name: Run App Engine to Verify Code
      run: |
        python3 generator_final.py

    - name: Build Android APK with Buildozer
      run: |
        # تشغيل البناء مع تفعيل الموافقة على الرخص ضمن بيئة صامتة
        yes | buildozer android debug

    - name: Upload Real Android APK
      uses: actions/upload-artifact@v4
      with:
        name: Palestine-Movie-Android-App
        path: .buildozer/android/platform/build-armeabi-v7a_arm64-v8a/dists/palestinemovie/build/outputs/apk/debug/*.apk
