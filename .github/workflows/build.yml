name: Build Palestine Movie Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Buildozer and Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev libffi-dev search python3-dev
        pip install --upgrade pip
        pip install buildozer cython requests pillow

    - name: Generate Buildozer Specification
      run: |
        # توليد ملف إعدادات المصنع التلقائي للتطبيق إذا لم يكن موجوداً
        if [ ! -f "buildozer.spec" ]; then
          buildozer init
          # تعديل الإعدادات لتدعم مكتبات الإنترنت والصور التي يحتاجها تطبيقك
          sed -i 's/^title =.*/title = Palestine Movie App/' buildozer.spec
          sed -i 's/^package.name =.*/package.name = palestinemovie/' buildozer.spec
          sed -i 's/^requirements =.*/requirements = python3,kivy,requests,pillow/' buildozer.spec
          sed -i 's/^#android.permissions =.*/android.permissions = INTERNET,WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE/' buildozer.spec
        fi

    - name: Run App Engine to Verify Code
      run: |
        # التأكد من أن ملف البايثون الخاص بك يجلب روابط البث بدون أخطاء قبل البناء
        python3 generator_final.py

    - name: Build Android APK with Buildozer
      run: |
        # إطلاق المصنع لصناعة ملف الأندرويد الحقيقي
        buildozer android debug

    - name: Upload Real Android APK
      uses: actions/upload-artifact@v4
      with:
        name: Palestine-Movie-Android-App
        path: .buildozer/android/platform/build-armeabi-v7a_arm64-v8a/dists/palestinemovie/build/outputs/apk/debug/*.apk
