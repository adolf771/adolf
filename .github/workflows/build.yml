name: Build Palestine Movie App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: palestine-movie-android-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: adolf_source

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
          cache-dependency-path: adolf_source/**/gradle-wrapper.properties

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: adolf_source/requirements.txt

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Install Python dependencies
        run: |
          set -e

          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt --no-cache-dir
          python -m pip install --no-cache-dir "flet-cli==0.86.5"

          python -m pip check

      - name: Verify Python source
        run: |
          set -e
          python -m compileall -q main.py

      - name: Verify Flutter and Android setup
        run: |
          set -e

          export PATH="$FLUTTER_ROOT/bin:$PATH"

          flutter --version
          dart --version

          yes | flutter doctor --android-licenses || true
          flutter doctor -v || true

          flet --version

      - name: Build Android APK
        env:
          FLET_CLI_NO_RICH_OUTPUT: "true"
          FLET_CLI_SKIP_FLUTTER_DOCTOR: "true"
        run: |
          set -e

          export PATH="$FLUTTER_ROOT/bin:$PATH"

          rm -rf build/apk

          flet build apk \
            --yes \
            --no-rich-output \
            --skip-flutter-doctor \
            --verbose \
            --build-version 1.0.2 \
            --build-number 18

          find build/apk \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print

      - name: Check generated APK
        run: |
          set -e

          APK="$(
            find build/apk \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              ! -name "*-signed.apk" \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "APK was not generated"
            exit 1
          fi

          ls -lh "$APK"

      - name: Sign APK with stable key
        run: |
          set -e

          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"

          APKSIGNER="$(
            find "$SDK_DIR/build-tools" \
              -type f \
              -name apksigner \
              2>/dev/null \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$APKSIGNER" ]; then
            echo "apksigner was not found"
            exit 1
          fi

          APK="$(
            find build/apk \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              ! -name "*-signed.apk" \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "Unsigned APK was not found"
            exit 1
          fi

          if [ ! -f ../android-release.jks ]; then
            echo "../android-release.jks was not found"
            exit 1
          fi

          SIGNED_APK="build/apk/Palestine-Movie-App-1.0.2-signed.apk"

          "$APKSIGNER" sign \
            --ks ../android-release.jks \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$SIGNED_APK" \
            "$APK"

          "$APKSIGNER" verify --verbose "$SIGNED_APK"

          ls -lh "$SIGNED_APK"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Palestine-Movie-App-1.0.2
          path: adolf_source/build/apk/*-signed.apk
          if-no-files-found: error
          retention-days: 14
