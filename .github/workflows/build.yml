name: Build Palestine Movie Fast Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Flutter Environment
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.8' # قمنا بتثبيت نفس النسخة المطلوبة من فلت بدقة مسبقا
        channel: 'stable'

    - name: Install Fast Application Dependencies
      run: |
        pip install --upgrade pip
        pip install flet requests pillow

    - name: Run App Engine to Verify Code
      run: |
        python3 main.py

    - name: Build Fast Android APK
      env:
        # الحــــــــل النهائي والجذري: منع فلت من تنزيل فلاتر خاص به وإجباره على استخدام النسخة الجاهزة بدون أسئلة
        FLET_SKIP_FLUTTER_INSTALL: "true"
      run: |
        # ربط المسار العالمي وإطلاق البناء النظيف مباشرة
        export PATH="$FLUTTER_ROOT/bin:$PATH"
        
        # الموافقة الصامتة المسبقة على الرخص
        yes | flutter doctor --android-licenses || true
        
        # بناء التطبيق الفوري بسلام وبدون طرح أي أسئلة يدوية
        flet build apk
