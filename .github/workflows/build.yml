name: Build Palestine Movie App

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: palestine-movie-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt --no-cache-dir
          python -m pip check

      - name: Verify Python source
        run: python -m compileall -q main.py

      - name: Build signed Android APK
        env:
          FLET_SKIP_FLUTTER_INSTALL: "true"
        run: |
          export PATH="$FLUTTER_ROOT/bin:$PATH"
          yes | flutter doctor --android-licenses || true

          flet build apk \
            --yes \
            --build-version 1.0.2 \
            --build-number 18 \
            --android-signing-key-store android-release.jks \
            --android-signing-key-store-password android \
            --android-signing-key-password android \
            --android-signing-key-alias androiddebugkey

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Palestine-Movie-App-1.0.2
          path: build/apk/*.apk
