name: Build Palestine Movie Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev libffi-dev python3-dev aidl libjpeg-dev
        pip install --upgrade pip
        # استخدام إصدار حديث ومستقر ومطابق لـ Buildozer تلقائياً لتجنب خطأ بناء الـ Wheel
        pip install buildozer cython requests pillow

    - name: Generate and Patch Buildozer Specification
      run: |
        if [ ! -f "buildozer.spec" ]; then
          buildozer init
        fi
        # ضبط الإعدادات الرسمية والثابتة لمنع تعطل الأندرويد
        sed -i 's/^title =.*/title = Palestine Movie App/' buildozer.spec
        sed -i 's/^package.name =.*/package.name = palestinemovie/' buildozer.spec
        sed -i 's/^requirements =.*/requirements = python3,kivy,requests,pillow/' buildozer.spec
        sed -i 's/^# android.accept_sdk_license =.*/android.accept_sdk_license = True/' buildozer.spec
        sed -i 's/^#android.permissions =.*/android.permissions = INTERNET,WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE/' buildozer.spec
        
        # تحديد إصدار NDK مستقر رقمياً بالأرقام فقط لتجنب خطأ (r28c) السابق والـ ValueError
        sed -i 's/^# android.ndk =.*/android.ndk = 25b/' buildozer.spec
        sed -i 's/^# android.api =.*/android.api = 33/' buildozer.spec
        
        # تثبيت رقم التحديث بشكل صحيح يقبله الهاتف للتحديث المباشر
        sed -i 's/^version.numeric =.*/version.numeric = 2/' buildozer.spec
        sed -i 's/^version.fix =.*/version.fix = 0/' buildozer.spec

    - name: Run App Engine to Verify Code
      run: |
        python3 generator_final.py

    - name: Build Android APK with Buildozer
      run: |
        # تشغيل بناء الأندرويد بشكل نظيف ومستقر مع إعطاء صلاحيات الرخص كاملة
        buildozer android debug

    - name: Upload Real Android APK
      uses: actions/upload-artifact@v4
      with:
        name: Palestine-Movie-Android-App
        path: .buildozer/android/platform/build-armeabi-v7a_arm64-v8a/dists/palestinemovie/build/outputs/apk/debug/*.apk
