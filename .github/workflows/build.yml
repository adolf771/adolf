name: Build Palestine Movie App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.6
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.6'

    - name: Generate Complete Palestine Movie Project
      run: |
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/java/com/stream/hitv/data/model
        mkdir -p app/src/main/java/com/stream/hitv/data/repository
        mkdir -p app/src/main/java/com/stream/hitv/ui/theme
        mkdir -p app/src/main/java/com/stream/hitv/ui/components
        mkdir -p app/src/main/java/com/stream/hitv/ui/screens
        mkdir -p app/src/main/java/com/stream/hitv/ui/player
        mkdir -p app/src/main/java/com/stream/hitv/ui/navigation

        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "PalestineMovie"
        include(":app")
        EOF

        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.3.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.23" apply false
        }
        EOF

        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        EOF

        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }

        android {
            namespace = "com.stream.hitv"
            compileSdk = 34

            defaultConfig {
                applicationId = "com.stream.hitv"
                minSdk = 24
                targetSdk = 34
                versionCode = 2
                versionName = "2.0"
            }

            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = "17"
            }
            buildFeatures {
                compose = true
            }
            composeOptions {
                kotlinCompilerExtensionVersion = "1.5.11"
            }
        }

        dependencies {
            implementation("androidx.core:core-ktx:1.13.1")
            implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
            implementation("androidx.activity:activity-compose:1.9.0")
            implementation(platform("androidx.compose:compose-bom:2024.04.01"))
            implementation("androidx.compose.ui:ui")
            implementation("androidx.compose.ui:ui-graphics")
            implementation("androidx.compose.material3:material3")
            implementation("androidx.compose.material:material-icons-extended")
            implementation("androidx.navigation:navigation-compose:2.7.7")
            implementation("io.coil-kt:coil-compose:2.6.0")
            implementation("androidx.media3:media3-exoplayer:1.3.1")
            implementation("androidx.media3:media3-ui:1.3.1")
            implementation("androidx.media3:media3-exoplayer-hls:1.3.1")
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <application
                android:allowBackup="true"
                android:label="Palestine Movie"
                android:supportsRtl="true"
                android:theme="@style/Theme.HiTV"
                android:hardwareAccelerated="true">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout"
                    android:theme="@style/Theme.HiTV">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/res/values/themes.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="Theme.HiTV" parent="android:Theme.Material.NoActionBar">
                <item name="android:statusBarColor">#090A0C</item>
                <item name="android:navigationBarColor">#090A0C</item>
            </style>
        </resources>
        EOF

        cat << 'EOF' > app/src/main/java/com/stream/hitv/data/model/Models.kt
        package com.stream.hitv.data.model

        data class Episode(val episodeNumber: Int, val title: String, val videoUrl: String, val duration: String = "45m")
        data class MediaItem(val id: String, val title: String, val description: String, val posterUrl: String, val bannerUrl: String, val rating: Double, val releaseYear: String, val type: String, val categoryName: String, val episodes: List<Episode>)
        data class DownloadItem(val mediaId: String, val mediaTitle: String, val posterUrl: String, val episodeNumber: Int, val episodeTitle: String, val videoUrl: String, val size: String = "120 MB")
        EOF

        cat << 'EOF' > app/src/main/java/com/stream/hitv/data/repository/MediaRepository.kt
        package com.stream.hitv.data.repository

        import androidx.compose.runtime.mutableStateListOf
        import com.stream.hitv.data.model.*

        object MediaRepository {
            private val sampleEpisodes = listOf(
                Episode(1, "الحلقة 1 - البداية والنهوض", "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"),
                Episode(2, "الحلقة 2 - نقطة التحول", "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4"),
                Episode(3, "الحلقة 3 - المعركة الكبرى", "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4")
            )

            val mediaList = listOf(
                MediaItem("1", "Solo Hunter: Awakening", "في عالم مليء بالبوابات والوحوش، يستيقظ أضعف صياد بقوة غير محدودة.", "https://images.unsplash.com/photo-1578632767115-351597cf2477?w=500&q=80", "https://images.unsplash.com/photo-1534447677768-be436bb09401?w=1000&q=80", 9.8, "2024", "anime", "أنمي خارق", sampleEpisodes),
                MediaItem("2", "Attack of Legends", "قصة البشرية المحاصرة خلف الأسوار دفاعاً عن وجودها.", "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=500&q=80", "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1000&q=80", 9.9, "2023", "anime", "أنمي حماسي", sampleEpisodes),
                MediaItem("3", "The Seoul Mystery", "دراما كورية مشوقة تدور حول محقق يواجه أسراراً مدفونة في قلب سيول.", "https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=500&q=80", "https://images.unsplash.com/photo-1514565131-fce0801e5785?w=1000&q=80", 9.5, "2023", "series", "دراما كورية", sampleEpisodes),
                MediaItem("4", "Interstellar Horizon", "رحلة فضائية عبر ثقب دودي بحثاً عن كوكب جديد لإنقاذ البشرية.", "https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=500&q=80", "https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?w=1000&q=80", 9.7, "2024", "movie", "أفلام خيال علمي", sampleEpisodes)
            )

            val favoriteIds = mutableStateListOf<String>("1")
            val downloads = mutableStateListOf<DownloadItem>()

            fun toggleFavorite(id: String) {
                if (favoriteIds.contains(id)) favoriteIds.remove(id) else favoriteIds.add(id)
            }

            fun isFavorite(id: String): Boolean = favoriteIds.contains(id)

            fun addDownload(item: DownloadItem) {
                if (downloads.none { it.mediaId == item.mediaId && it.episodeNumber == item.episodeNumber }) {
                    downloads.add(item)
                }
            }

            fun removeDownload(mediaId: String, episodeNumber: Int) {
                downloads.removeAll { it.mediaId == mediaId && it.episodeNumber == episodeNumber }
            }

            fun getMediaById(id: String): MediaItem? = mediaList.find { it.id == id }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/stream/hitv/ui/theme/Theme.kt
