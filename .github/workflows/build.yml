name: Build Palestine Movie Fast Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Fast Application Dependencies
      run: |
        pip install --upgrade pip
        pip install flet requests pillow

    - name: Run App Engine to Verify Code
      run: |
        python3 generator_final.py

    - name: Build Fast Android APK
      run: |
        # 1. قبول رخص أندرويد تلقائياً داخل بيئة فلاتر الجديدة
        mkdir -p ~/.config/flutter
        echo "y" | echo "y" | echo "y" | echo "y" | echo "y" | echo "y" | echo "y"
        
        # 2. الحــــــــل: إعلام الأداة باسم ملفك الرئيسي وتمرير الموافقة الصامتة للتجميع
        echo "y" | flet build apk --project PalestineMovieApp --module-name generator_final

    - name: Upload Real Android APK
      uses: actions/upload-artifact@v4
      with:
        name: Palestine-Movie-Fast-App
        path: build/apk/*.apk
