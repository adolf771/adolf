name: Build Palestine Movie Final Clean APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Flutter Environment
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.8'
        channel: 'stable'

    # الحــــــــل الجذري: فرض تثبيت إصدارات متوافقة بالملي تمنع تضارب الـ pip وتخنق الإعلانات
    - name: Fix and Install Compatible Dependencies
      run: |
        python -m pip install --upgrade pip
        cat <<EOF > requirements.txt
        flet==0.26.0
        flet-video==0.26.0
        flet-webview==0.26.0
        requests
        pillow
        EOF
        pip install -r requirements.txt --no-cache-dir

    - name: Run Code Verification
      run: |
        python3 main.py

    - name: Build Clean Android APK
      env:
        FLET_SKIP_FLUTTER_INSTALL: "true"
      run: |
        export PATH="$FLUTTER_ROOT/bin:$PATH"
        yes | flutter doctor --android-licenses || true
        
        # إجبار التجميع الصامت النظيف متوافقاً مع الحزم الجديدة
        flet build apk

    - name: Upload Final Clean APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Palestine-Movie-Final-Clean-App
        path: build/apk/*.apk
