name: Build Palestine Movie Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Generate Requirements File
        shell: bash
        run: |
          cat > requirements.txt <<'EOF'
          flet
          requests
          pillow
          EOF

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Prepare App Icon From Any Image
        shell: bash
        run: |
          mkdir -p assets

          if [ -f "assets/icon.png" ]; then
            echo "Using existing assets/icon.png"
          else
            ICON_SOURCE="$(
              find . -type f \
                \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" \
                   -o -iname "*.webp" \) \
                ! -path "./.git/*" \
                ! -path "./build/*" \
                ! -path "./assets/*" \

                | sort | head -n 1
            )"

            if [ -z "$ICON_SOURCE" ]; then
              echo "No image found for the app icon."
              exit 1
            fi

            echo "Using image: $ICON_SOURCE"

            python - "$ICON_SOURCE" <<'PY'
          import sys
          from pathlib import Path

          from PIL import Image

          source = Path(sys.argv[1])
          output = Path("assets/icon.png")

          image = Image.open(source).convert("RGBA")
          width, height = image.size
          side = min(width, height)
          left = (width - side) // 2
          top = (height - side) // 2

          image = image.crop(
              (left, top, left + side, top + side)
          )

          image = image.resize(
              (1024, 1024),
              Image.Resampling.LANCZOS,
          )

          image.save(
              output,
              format="PNG",
              optimize=True,
          )

          print(f"Created {output} from {source}")
          PY
          fi

      - name: Verify Python Syntax
        run: |
          python -m py_compile main.py

      - name: Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Build Palestine Movie APK
        env:
          FLET_SKIP_FLUTTER_INSTALL: "true"
        run: |
          flet build apk \
            --project "palestine_movie" \
            --product "Palestine Movie" \
            --org "com.palestinemovie" \
            --description "تطبيق أفلام وأنمي فلسطيني" \
            --android-adaptive-icon-background "#090909" \
            --yes \
            --skip-flutter-doctor \
            --vv

      - name: Upload Palestine Movie APK
        uses: actions/upload-artifact@v4
        with:
          name: Palestine-Movie-APK
          path: build/apk/*.apk
          if-no-files-found: error
