name: Build Palestine Movie App

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable

      - name: Install pinned Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt --no-cache-dir
          python -m pip check

      - name: Verify Python source
        run: python -m compileall -q main.py

      - name: Build Android APK
        env:
          FLET_SKIP_FLUTTER_INSTALL: "true"
        run: |
          export PATH="$FLUTTER_ROOT/bin:$PATH"
          yes | flutter doctor --android-licenses || true
          flet build apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Palestine-Movie-App
          path: build/apk/*.apk
