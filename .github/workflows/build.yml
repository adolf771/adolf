        cat << 'EOF' > app/src/main/java/com/stream/hitv/ui/player/PlayerScreen.kt
        package com.stream.hitv.ui.player

        import android.app.Activity
        import android.content.pm.ActivityInfo
        import android.view.ViewGroup
        import android.widget.FrameLayout
        import androidx.annotation.OptIn
        import androidx.compose.foundation.background
        import androidx.compose.foundation.layout.Box
        import androidx.compose.foundation.layout.fillMaxSize
        import androidx.compose.runtime.*
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.graphics.Color
        import androidx.compose.ui.platform.LocalContext
        import androidx.compose.ui.viewinterop.AndroidView
        import androidx.media3.common.MediaItem
        import androidx.media3.common.util.UnstableApi
        import androidx.media3.exoplayer.ExoPlayer
        import androidx.media3.ui.PlayerView
        import com.stream.hitv.data.repository.MediaRepository

        @OptIn(UnstableApi::class)
        @Composable
        fun PlayerScreen(mediaId: String, episodeNum: Int) {
            val context = LocalContext.current
            val activity = context as? Activity
            val media = MediaRepository.getMediaById(mediaId)
            val ep = media?.episodes?.find { it.episodeNumber == episodeNum } ?: media?.episodes?.firstOrNull()

            val exoPlayer = remember {
                ExoPlayer.Builder(context).build().apply {
                    ep?.videoUrl?.let { url ->
                        setMediaItem(MediaItem.fromUri(url))
                        prepare()
                        playWhenReady = true
                    }
                }
            }

            DisposableEffect(Unit) {
                activity?.requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE
                onDispose {
                    exoPlayer.release()
                    activity?.requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED
                }
            }

            Box(modifier = Modifier.fillMaxSize().background(Color.Black)) {
                AndroidView(
                    factory = { ctx ->
                        PlayerView(ctx).apply {
                            player = exoPlayer
                            useController = true
                            layoutParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)
                        }
                    },
                    modifier = Modifier.fillMaxSize()
                )
            }
        }
        EOF

